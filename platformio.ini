; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Root CA bundle for HTTPS verification (regenerate with scripts/gen_crt_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin
lib_deps =
	lvgl/lvgl@9.6.0
	bodmer/TFT_eSPI@2.5.43
	bblanchon/ArduinoJson@7.4.1
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
	bodmer/JPEGDecoder@1.8.1

build_flags =
  -I include
  -D LV_CONF_INCLUDE_SIMPLE
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D USE_HSPI_PORT
; Same firmware plus serial screenshot and touch commands (src/devtools.h,
; host side in scripts/devtools.py)
[env:esp32dev-devtools]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D KIDDO_DEVTOOLS
